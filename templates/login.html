{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Login</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>MedEdu ID</label>
                <input type="text" name="mededu_id" placeholder="Enter your MedEdu ID" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="{% url 'signup' %}">Signup</a>
        </p>

    </div>

</div>

{% endblock %}
