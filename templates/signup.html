{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Create Account</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- USERNAME -->
            <div class="form-group">
                <label>Username</label>
                <input 
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label>Email</label>
                <input 
                    type="email"
                    name="email"
                    placeholder="Enter your email address"
                    required>
            </div>

            <!-- PHONE -->
            <div class="form-group">
                <label>Phone</label>
                <input 
                    type="text"
                    name="phone"
                    placeholder="Enter your phone number"
                    required>
            </div>

            <!-- ROLE -->
            <div class="form-group">
                <label>Role</label>
                <select name="role" required>
                    <option value="" disabled selected hidden>Select your role</option>
                    <option value="medical_student">Medical Student</option>
                    <option value="dental_student">Dental Student</option>
                    <option value="faculty">Faculty</option>
                    <option value="intern">Intern Doctor</option>
                    <option value="doctor">Doctor</option>
                    <option value="ward">Ward Authority</option>
                    <option value="library">Library Staff</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label>Password</label>
                <input 
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required>
            </div>

            <!-- SUBMIT -->
            <button type="submit" class="auth-btn">
                Create Account
            </button>

        </form>

        <!-- SUCCESS / ERROR MESSAGE -->
        {% if error %}
            <p style="color:red; text-align:center;">{{ error }}</p>
        {% endif %}

        <!-- LOGIN LINK -->
        <p class="auth-link">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>

</div>

{% endblock %}
