{% extends "base.html" %}
{% block content %}

<div class="analytics-wrapper">

    

    <div class="analytics-grid">

        {% for s in students %}

        <div class="analytics-card">

            <div class="student-top">

                <h2>
                    {{ s.username }}
                </h2>

                <span>
                    {{ s.mededu_id }}
                </span>

            </div>

            <div class="student-stats">

                <div class="mini-box">
                    <h4>Average</h4>
                    <p>{{ s.avg_marks }}%</p>
                </div>

                <div class="mini-box">
                    <h4>Pass Rate</h4>
                    <p>{{ s.pass_rate }}%</p>
                </div>

                <div class="mini-box">
                    <h4>Status</h4>

                    {% if s.eligible %}
                        <p class="eligible">
                            Eligible
                        </p>
                    {% else %}
                        <p class="not-eligible">
                            Pending
                        </p>
                    {% endif %}

                </div>

            </div>

            <a href="{% url 'download_report' s.id %}"
               class="download-btn">

               Download Report

            </a>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
