<!DOCTYPE html>
<html>

<head>

    <title>
        Student Report
    </title>

    <style>

        body{
            font-family: Arial;
            padding: 40px;
            background: #ffffff;
            color: #333;
        }

        .pdf-container{
            width: 100%;
        }

        h1{
            text-align: center;
            color: #b97f7f;
            margin-bottom: 5px;
        }

        h2{
            text-align: center;
            margin-bottom: 35px;
            color: #444;
        }

        .info-box{
            background: #f8eeee;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .info-box p{
            margin: 10px 0;
            font-size: 16px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th, td{
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th{
            background: #e7c4c4;
            color: #222;
        }

        tr:nth-child(even){
            background: #faf5f5;
        }

    </style>

</head>

<body>

<div class="pdf-container">

    <h1>
        MedEdu Portal
    </h1>

    <h2>
        Student Academic Report
    </h2>

    <div class="info-box">

        <p>
            <strong>Name:</strong>
            {{ student.username }}
        </p>

        <p>
            <strong>ID:</strong>
            {{ student.mededu_id }}
        </p>

        <p>
            <strong>Attendance:</strong>
            {{ attendance_percentage }}%
        </p>

    </div>

    <table>

        <thead>

            <tr>

                <th>
                    Subject
                </th>

                <th>
                    Marks
                </th>

                <th>
                    Status
                </th>

            </tr>

        </thead>

        <tbody>

            {% for r in results %}

            <tr>

                <td>
                    {{ r.topic.subject.name }}
                </td>

                <td>
                    {{ r.marks }}
                </td>

                <td>
                    {{ r.status }}
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

<script>

window.print();

</script>

</body>
</html>
