{% extends 'base.html' %}

{% block content %}

<div class="container">

    <h2>Result - {{ exam_type|title }} (Phase {{ phase }})</h2>

    <table class="result-table">
        <tr>
            <th>Subject</th>
            <th>Marks</th>
            <th>Status</th>
            <th>Date</th>
        </tr>

        {% for r in results %}
        <tr>
            <td>{{ r.topic.title }}</td>
            <td>{{ r.marks }}</td>
            <td>{{ r.status }}</td>
            <td>{{ r.date }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No results found</td>
        </tr>
        {% endfor %}

    </table>

</div>

{% endblock %}
