{% extends "base.html" %}

{% block content %}

<div style="padding: 40px; text-align: center; color: white;">

    <h2>Welcome Library Staff, {{ request.user.username }}</h2>

    <div id="content-area"></div>

</div>

<script>

function loadContent(type) {

    let c = document.getElementById("content-area");

    if (type === "home") {

        c.innerHTML = "<h3>Library Dashboard</h3>";

    } 
    else if (type === "issue") {

        c.innerHTML = "<h3>Book Issue</h3>";

    } 
    else if (type === "return") {

        c.innerHTML = "<h3>Book Return</h3>";

    } 
    else if (type === "record") {

        c.innerHTML = "<h3>Book Records</h3>";

    } 
    else if (type === "history") {

        c.innerHTML = "<h3>Student Borrow History</h3>";

    } 
    else if (type === "notification") {

        c.innerHTML = "<h3>Notifications</h3>";

    }

}

</script>

{% endblock %}
