{% extends "base.html" %}

{% block content %}

<div style="padding: 40px; text-align: center; color: white;">

    <h2>Welcome, {{ request.user.username }}</h2>

    <div id="content-area">

        <h3>Student Dashboard</h3>

    </div>

</div>

<script>

function loadContent(type) {

    let c = document.getElementById("content-area");

    if (type === "home") {

        c.innerHTML = "<h3>Welcome Student</h3>";

    } 
    else if (type === "class") {

        c.innerHTML = "<h3>Class Schedule</h3>";

    } 
    else if (type === "course") {

        c.innerHTML = "<h3>Course & Syllabus</h3>";

    } 
    else if (type === "exam") {

        c.innerHTML = `
            <h3>Exam</h3>
            <label><input type="radio"> Item</label><br>
            <label><input type="radio"> Card</label><br>
            <label><input type="radio"> Term</label>
        `;

    } 
    else if (type === "result") {

        c.innerHTML = `
            <h3>Result</h3>
            <label><input type="radio"> Item</label><br>
            <label><input type="radio"> Card</label><br>
            <label><input type="radio"> Term</label>
        `;

    } 
    else if (type === "payment") {

        c.innerHTML = "<h3>Payment</h3>";

    } 
    else if (type === "library") {

        c.innerHTML = "<h3>Library</h3>";

    } 
    else if (type === "notification") {

        c.innerHTML = "<h3>Notifications</h3>";

    }

}

</script>

{% endblock %}
