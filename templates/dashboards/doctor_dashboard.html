{% extends "base.html" %}

{% block content %}

<div style="padding: 40px; text-align: center; color: white;">

    <h2>Welcome Doctor, {{ request.user.username }}</h2>

    <div id="content-area"></div>

</div>

<script>

function loadContent(type) {

    let c = document.getElementById("content-area");

    if (type === "home") {

        c.innerHTML = "<h3>Doctor Dashboard</h3>";

    } 
    else if (type === "class") {

        c.innerHTML = "<h3>Class Schedule</h3>";

    } 
    else if (type === "review") {

        c.innerHTML = "<h3>Clinical Case Review</h3>";

    } 
    else if (type === "notification") {

        c.innerHTML = "<h3>Notifications</h3>";

    }

}

</script>

{% endblock %}
