{% extends "base.html" %}

{% block content %}

<div style="padding: 40px; text-align: center; color: white;">

    <h2>Welcome Intern, {{ request.user.username }}</h2>

    <div id="content-area"></div>

</div>

<script>

function loadContent(type) {

    let c = document.getElementById("content-area");

    if (type === "home") {

        c.innerHTML = "<h3>Intern Dashboard</h3>";

    } 
    else if (type === "duty") {

        c.innerHTML = "<h3>Duty Schedule</h3>";

    } 
    else if (type === "case") {

        c.innerHTML = "<h3>Clinical Case Entry</h3>";

    } 
    else if (type === "payment") {

        c.innerHTML = "<h3>Payments</h3>";

    } 
    else if (type === "notification") {

        c.innerHTML = "<h3>Notifications</h3>";

    }

}

</script>

{% endblock %}
