{% extends "base.html" %}

{% block content %}

<div style="padding: 40px; text-align: center; color: white;">

    <h2>Welcome Faculty, {{ request.user.username }}</h2>

    <div id="content-area"></div>

</div>

<script>

function loadContent(type) {

    let c = document.getElementById("content-area");

    if (type === "home") {

        c.innerHTML = "<h3>Faculty Dashboard</h3>";

    } 
    else if (type === "class") {

        c.innerHTML = "<h3>Class Schedule</h3>";

    } 
    else if (type === "upload") {

        c.innerHTML = "<h3>Upload Marks</h3>";

    } 
    else if (type === "edit") {

        c.innerHTML = "<h3>Edit Marks</h3>";

    } 
    else if (type === "result") {

        c.innerHTML = "<h3>Exam Results</h3>";

    } 
    else if (type === "attendance") {

        c.innerHTML = "<h3>Student Attendance</h3>";

    } 
    else if (type === "notification") {

        c.innerHTML = "<h3>Notifications</h3>";

    }

}

</script>

{% endblock %}
