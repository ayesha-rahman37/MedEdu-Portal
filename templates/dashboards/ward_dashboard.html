{% extends "base.html" %}

{% block content %}

<div style="padding: 40px; text-align: center; color: white;">

    <h2>Welcome Ward Authority, {{ request.user.username }}</h2>

    <div id="content-area"></div>

</div>

<script>

function loadContent(type) {

    let c = document.getElementById("content-area");

    if (type === "home") {

        c.innerHTML = "<h3>Ward Dashboard</h3>";

    } 
    else if (type === "attendance") {

        c.innerHTML = "<h3>Students Attendance</h3>";

    } 
    else if (type === "duty") {

        c.innerHTML = "<h3>Student Duty List</h3>";

    } 
    else if (type === "report") {

        c.innerHTML = "<h3>Department Reports</h3>";

    } 
    else if (type === "notification") {

        c.innerHTML = "<h3>Notifications</h3>";

    }

}

</script>

{% endblock %}
