{% extends 'base.html' %}

{% block content %}

<div class="notification-container">

    <h2>Notifications</h2>

    {% for notification in notifications %}

        <div class="notification-card">

            <p>{{ notification.message }}</p>

            <small>
                {{ notification.created_at }}
            </small>

        </div>

    {% empty %}

        <p>No notifications available.</p>

    {% endfor %}

</div>

{% endblock %}
