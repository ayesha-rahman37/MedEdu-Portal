{% extends "base.html" %}
{% block content %}

<div class="ward-container">

    <div class="ward-card">

        <form method="POST" class="ward-form">

            {% csrf_token %}

            <div class="form-row">

                <div class="input-group">

                    <label>Select User</label>

                    <select name="user" required>

                        <option value="">
                            Select User
                        </option>

                        {% for u in users %}

                        <option value="{{ u.id }}">
                            {{ u.username }} ({{ u.role }})
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="input-group">

                    <label>Ward Name</label>

                    <input
                        type="text"
                        name="ward_name"
                        placeholder="Enter ward name"
                        required
                    >

                </div>

            </div>

            <div class="form-row">

                <div class="input-group">

                    <label>Duty Type</label>

                    <input
                        type="text"
                        name="duty_type"
                        placeholder="Morning / Night"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>Date</label>

                    <input
                        type="date"
                        name="date"
                        required
                    >

                </div>

            </div>

            <div class="form-row">

                <div class="input-group">

                    <label>Start Time</label>

                    <input
                        type="time"
                        name="start_time"
                        required
                    >

                </div>

                <div class="input-group">

                    <label>End Time</label>

                    <input
                        type="time"
                        name="end_time"
                        required
                    >

                </div>

            </div>

            <button type="submit" class="ward-btn">

                Assign Duty

            </button>

        </form>

    </div>

</div>

{% endblock %}
