{% extends "base.html" %}
{% block content %}

<div class="page-container">

    <div class="card-box">
        <h2>Book History</h2>

        <table class="table-custom">
            <tr>
                <th>Student</th>
                <th>Book</th>
                <th>Issue Date</th>
                <th>Returned</th>
            </tr>

            {% for issue in issues %}
            <tr>
                <td>{{ issue.student.username }}</td>
                <td>{{ issue.book.title }}</td>
                <td>{{ issue.issue_date }}</td>
                <td>
                    {% if issue.returned %}
                        Yes
                    {% else %}
                        No
                    {% endif %}
                </td>
            </tr>
            {% endfor %}

        </table>

    </div>

</div>

{% endblock %}
