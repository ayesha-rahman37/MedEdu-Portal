{% extends "base.html" %}
{% block content %}

<div class="library-dashboard">

    <div class="library-card">

        <table class="table-modern">

            <tr>
                <th>Student</th>
                <th>Book</th>
                <th>Issue Date</th>
                <th>Status</th>
            </tr>

            {% for issue in history %}

            <tr>

                <td>{{ issue.student.username }}</td>

                <td>{{ issue.book.title }}</td>

                <td>{{ issue.issue_date }}</td>

                <td>

                    {% if issue.returned %}

                    <span class="status-returned">
                        Returned
                    </span>

                    {% else %}

                    <span class="status-overdue">
                        Borrowed
                    </span>

                    {% endif %}

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</div>

{% endblock %}
