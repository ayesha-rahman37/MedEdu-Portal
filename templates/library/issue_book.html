{% extends "base.html" %}
{% block content %}

<div class="library-container">

    <div class="library-wrapper">

        <!-- LEFT CARD -->
        <div class="card issue-card">

            <h2>📚 Issue Book</h2>

            <form method="POST">
                {% csrf_token %}

                <label>Student</label>
                <select name="student">
                    {% for user in users %}
                        <option value="{{ user.id }}">
                            {{ user.username }} ({{ user.mededu_id }})
                        </option>
                    {% endfor %}
                </select>

                <label>Book</label>
                <select name="book">
                    {% for book in books %}
                        <option value="{{ book.id }}">
                            {{ book.title }} ({{ book.available_copies }} left)
                        </option>
                    {% endfor %}
                </select>

                <label>Due Date</label>
                <input type="date" name="due_date">

                <button type="submit">Issue Book</button>

            </form>

        </div>

        <!-- RIGHT CARD -->
        <div class="card info-card">

            <h2>📊 Quick Info</h2>

            <div class="info-row">
                <div>
                    <h4>Total Books</h4>
                    <p>{{ total_books }}</p>
                </div>
                <div>
                    <h4>Available</h4>
                    <p>{{ available_books }}</p>
                </div>
                <div>
                    <h4>Issued</h4>
                    <p>{{ issued_books }}</p>
                </div>
            </div>

        </div>

    </div>

</div>

{% endblock %}
