{% extends "base.html" %}
{% block content %}

<div class="container mt-5">

    <div class="card shadow-lg p-4 rounded-4">

        <h3 class="text-center mb-4 fw-bold">📚 Issue Book</h3>

        <form method="POST">
            {% csrf_token %}

            <!-- Student -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Select Student</label>
                <select name="student" class="form-select">
                    {% for user in users %}
                        <option value="{{ user.id }}">
                            {{ user.username }} ({{ user.mededu_id }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Book -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Select Book</label>
                <select name="book" class="form-select">
                    {% for book in books %}
                        <option value="{{ book.id }}">
                            {{ book.title }} (Available: {{ book.available_copies }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Due Date -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Due Date</label>
                <input type="date" name="due_date" class="form-control" required>
            </div>

            <!-- Button -->
            <div class="text-center">
                <button class="btn btn-primary px-4 py-2 rounded-3">
                    Issue Book
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
