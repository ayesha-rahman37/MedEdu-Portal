{% extends "base.html" %}
{% block content %}

<div class="issue-container">

    <div class="issue-card">

        <form method="POST" class="issue-form">

            {% csrf_token %}

            <div class="input-group">

                <label>

                    Select Student

                </label>

                <select name="student" required>

                    {% for user in users %}

                    <option value="{{ user.id }}">

                        {{ user.username }} ({{ user.mededu_id }})

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="input-group">

                <label>

                    Select Book

                </label>

                <select name="book" required>

                    {% for book in books %}

                    <option value="{{ book.id }}">

                        {{ book.title }} 
                        ({{ book.available_copies }} available)

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="input-group">

                <label>

                    Due Date

                </label>

                <input
                    type="date"
                    name="due_date"
                    required
                >

            </div>

            <button type="submit" class="issue-btn">

                Issue Book

            </button>

        </form>

    </div>

</div>

{% endblock %}
