{% extends 'base.html' %}

{% block content %}

<h2>Issue Book</h2>

<form method="POST">
    {% csrf_token %}

    <label>Student:</label>
    <select name="student">
        {% for user in users %}
        <option value="{{ user.id }}">{{ user.username }}</option>
        {% endfor %}
    </select>

    <br><br>

    <label>Book:</label>
    <select name="book">
        {% for book in books %}
        <option value="{{ book.id }}">{{ book.title }}</option>
        {% endfor %}
    </select>

    <br><br>

    <label>Due Date:</label>
    <input type="date" name="due_date">

    <br><br>

    <button type="submit">Issue Book</button>

</form>

{% endblock %}
