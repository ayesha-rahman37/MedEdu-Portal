{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="width: 500px;">
        <h2>➕ Add New Book</h2>
        
        {% if messages %}
            {% for message in messages %}
                <p style="color: green; text-align: center;">{{ message }}</p>
            {% endfor %}
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Book Title *</label>
                <input type="text" name="title" required>
            </div>
            
            <div class="form-group">
                <label>Author *</label>
                <input type="text" name="author" required>
            </div>
            
            <div class="form-group">
                <label>Category *</label>
                <select name="category" required>
                    <option value="textbook">Textbook</option>
                    <option value="reference">Reference</option>
                    <option value="journal">Journal</option>
                    <option value="general">General Reading</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Total Copies *</label>
                <input type="number" name="total_copies" value="1" min="1" required>
            </div>
            
            <div class="form-group">
                <label>ISBN</label>
                <input type="text" name="isbn" placeholder="Optional">
            </div>
            
            <div class="form-group">
                <label>Publisher</label>
                <input type="text" name="publisher" placeholder="Optional">
            </div>
            
            <div class="form-group">
                <label>Year</label>
                <input type="number" name="year" placeholder="Optional">
            </div>
            
            <div class="form-group">
                <label>Location (Rack/Shelf)</label>
                <input type="text" name="location" placeholder="e.g., A-1">
            </div>
            
            <button type="submit" class="auth-btn">Add Book</button>
        </form>
        
        <div style="margin-top: 20px; text-align: center;">
            <a href="{% url 'library_dashboard' %}" class="secondary-btn">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
