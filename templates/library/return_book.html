{% extends 'base.html' %}

{% block content %}

<h2>Return Book</h2>

<table border="1">
    <tr>
        <th>Student</th>
        <th>Book</th>
        <th>Action</th>
    </tr>

    {% for i in issued_books %}
    <tr>
        <td>{{ i.student.username }}</td>
        <td>{{ i.book.title }}</td>
        <td>
            <a href="{% url 'return_book_action' i.id %}">Return</a>
        </td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
