{% extends "base.html" %}
{% block content %}

<div class="library-dashboard">

    <div class="library-card">

        <table class="table-modern">

            <tr>
                <th>Book</th>
                <th>Author</th>
                <th>Total</th>
                <th>Available</th>
                <th>Issued</th>
            </tr>

            {% for b in data %}

            <tr>

                <td>{{ b.title }}</td>
                <td>{{ b.author }}</td>
                <td>{{ b.total }}</td>
                <td>{{ b.available }}</td>
                <td>{{ b.issued }}</td>

            </tr>

            {% endfor %}

        </table>

    </div>

</div>

{% endblock %}
