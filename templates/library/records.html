{% extends "base.html" %}
{% block content %}

<div class="page-container">

    <div class="card-box">
        <h2>Library Records</h2>

        <table class="table-custom">
            <tr>
                <th>Student</th>
                <th>Book</th>
                <th>Status</th>
                <th>Due Date</th>
            </tr>

            {% for issue in issues %}
            <tr>
                <td>{{ issue.student.username }}</td>
                <td>{{ issue.book.title }}</td>
                <td>
                    {% if issue.returned %}
                        Returned
                    {% else %}
                        Issued
                    {% endif %}
                </td>
                <td>{{ issue.due_date }}</td>
            </tr>
            {% endfor %}

        </table>

    </div>

</div>

{% endblock %}
