{% extends "base.html" %}
{% block content %}

<div class="library-dashboard">

    <div class="library-card">

        <table class="table-modern">

            <tr>
                <th>Book</th>
                <th>Issue</th>
                <th>Due</th>
                <th>Fine</th>
                <th>Status</th>
            </tr>

            {% for i in issues %}

            <tr>

                <td>{{ i.book.title }}</td>

                <td>{{ i.issue_date }}</td>

                <td>{{ i.due_date }}</td>

                <td>{{ i.fine }} BDT</td>

                <td>

                    {% if i.returned %}

                    <span class="status-returned">
                        Returned
                    </span>

                    {% else %}

                    <span class="status-issued">
                        Borrowed
                    </span>

                    {% endif %}

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</div>

{% endblock %}
