{% extends "base.html" %}
{% block content %}

<div class="create-update-container">

    <div class="create-update-card">

        <h1 class="create-title">
            Publish Medical Update
        </h1>

        <form method="POST" class="create-form">

            {% csrf_token %}

            <input
                type="text"
                name="title"
                placeholder="Update Title"
                required
            >

            <select name="category">

                <option value="news">
                    Medical News
                </option>

                <option value="career">
                    Career Opportunity
                </option>

                <option value="research">
                    Research
                </option>

                <option value="seminar">
                    Seminar
                </option>

                <option value="scholarship">
                    Scholarship
                </option>

            </select>

            <textarea
                name="description"
                placeholder="Write details..."
                rows="6"
            ></textarea>

            <input
                type="url"
                name="link"
                placeholder="Optional Link"
            >

            <button type="submit">

                Publish Update

            </button>

        </form>

    </div>

</div>

{% endblock %}
