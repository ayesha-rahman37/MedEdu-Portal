{% extends "base.html" %}

{% block content %}

<h3>{{ student.username }} - {{ exam_type|title }}</h3>

{% if eligible %}
    <p style="color:green;">Eligible ✅</p>
{% else %}
    <p style="color:red;">Not Eligible ❌</p>
    <p>{{ reason }}</p>
{% endif %}

<a href="{% url 'student_records' %}">Back</a>

{% endblock %}
